name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate iOS project & Fix Deployment Target
        run: |
          # 1. 补全 iOS 宿主工程
          flutter create --platforms=ios .

          # 2. 锁定 iOS 部署目标为 16.0
          ruby -e '
            podfile = File.read("ios/Podfile")
            podfile.gsub!(/#? *platform :ios.*/, "platform :ios, '\''16.0'\''")
            File.write("ios/Podfile", podfile)
          '
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Code Generation & Dependencies
        run: |
          flutter pub get

          # 生成多语言绑定 (解决 context.l10n 报错)
          flutter gen-l10n || true

          # 运行 build_runner 生成 Freezed 与 Riverpod 状态类 (解决 state.error 等缺失)
          dart run build_runner build --delete-conflicting-outputs

          # 安装 iOS CocoaPods 依赖
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Aaalice_NAI_Launcher_unsigned.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAI-Launcher-iOS
          path: build/ios/iphoneos/Aaalice_NAI_Launcher_unsigned.ipa
